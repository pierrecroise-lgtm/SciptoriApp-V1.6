<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>La Réserve — ScriptoriApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel:wght@800&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* reserve.html reste autonome : tout son CSS et son JS spécifiques
     sont ici (et dans reserve-app.js). Seuls la topbar-image, le
     panneau 9-slice, le bandeau de nav et les boutons .btn-dnd
     viennent de common.css. */

  /* La page ne scrolle plus dans son ensemble : le fond (reserve-bg.png)
     garde toujours la taille de l'écran, seul le carrousel de livres
     défile en interne. */
  html, body{ height:100%; margin:0; overflow:hidden; }
  body{ font-size:19px; display:flex; flex-direction:column; }

  /* La topbar est un enfant flex sans hauteur explicite (elle dépend de
     aspect-ratio) : sans flex-shrink:0, flexbox la compresse dès que le
     reste du contenu (carrousel une fois les livres chargés) réclame plus
     de place que l'écran n'en a — elle se retrouvait alors tronquée. */
  .topbar-rubrique{ flex:none; }

  /* ============ SCENE (fond fixe, jamais déformé) ============ */
  .reserve-scene{
    position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
    background-image:
      linear-gradient(180deg, rgba(10,6,3,.45) 0%, rgba(10,6,3,.14) 26%, rgba(10,6,3,.72) 100%),
      url('images/reserve-bg.png');
    background-size:cover;
    background-position:center bottom;
    background-repeat:no-repeat;
  }

  /* ============ TOPBAR — zone tactile invisible centrale ============ */
  .topbar-hitbox{
    position:absolute; inset:0; left:22%; right:22%;
    background:none; border:none; padding:0; margin:0; cursor:pointer; z-index:5;
  }

  /* ============ PLAQUE EVOLUTIVE (rétractable) ============ */
  .evolutive-plaque{
    position:absolute; top:12px; left:14px; right:14px; z-index:16;
    display:flex; align-items:center; gap:10px;
    margin:0; padding:12px 14px;
    background:linear-gradient(180deg, var(--oak-800), var(--oak-900));
    border:2px solid var(--brass);
    border-radius:4px;
    box-shadow:0 4px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(232,205,148,.12);
    transition:transform .5s cubic-bezier(.5,0,.2,1), opacity .4s ease;
  }
  .evolutive-plaque.collapsed{ transform:translateY(-160%); opacity:0; pointer-events:none; }
  .evolutive-plaque__icon{ flex:none; width:22px; height:22px; color:var(--brass-light); opacity:.9; }
  .evolutive-plaque__text{ font-size:15px; line-height:1.35; color:var(--parchment); }
  .evolutive-plaque__text strong{ color:var(--brass-light); }

  /* ============ BARRE DE CONTROLE (onglets + tri) — fixe, ne défile pas ============ */
  .control-bar{ flex:none; padding:82px 14px 10px; }

  .ribbon-tabs{ display:flex; gap:10px; margin-bottom:14px; }
  .ribbon-tab-img{
    flex:1; border:none; background:none; padding:0; cursor:pointer;
    opacity:.55; transition:opacity .15s ease, transform .15s ease;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));
  }
  .ribbon-tab-img img{ width:100%; display:block; }
  .ribbon-tab-img[aria-selected="true"]{ opacity:1; transform:translateY(-2px); filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }

  .filters-bar{ display:flex; justify-content:center; }
  .sort-trigger{ position:relative; width:132px; cursor:pointer; }
  .sort-trigger img{ width:100%; display:block; }
  .sort-trigger select{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; border:none; cursor:pointer;
  }

  /* ============ CARROUSEL — seule zone qui défile ============ */
  .carousel-area{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    scroll-snap-type:y proximity;
    padding:6px 0 26px;
    -webkit-overflow-scrolling:touch;
  }
  .grimoire-list{ display:flex; flex-direction:column; align-items:center; gap:16px; margin:0; padding:0 14px; list-style:none; }

  .grimoire-card{ display:flex; justify-content:center; width:100%; scroll-snap-align:start; scroll-snap-stop:normal; }
  .grimoire-card .panel{
    width:50vw; margin:0 auto;
    filter:brightness(.7) saturate(.85);
    transition:width .3s ease, filter .3s ease;
  }
  .grimoire-card.is-focused .panel{ width:60vw; filter:brightness(1) saturate(1); }
  @media (max-width:640px){
    .grimoire-card .panel{ width:78vw; }
    .grimoire-card.is-focused .panel{ width:92vw; }
    :root{ --panel-corner:20px; }
    .panel-content{ padding:10px 12px; }
    .book-row{ gap:8px; }
    .book-row__cover{ width:54px; height:78px; }
    .book-row__actions{ gap:6px; }
    .icon-action-btn{ width:30px; height:30px; }
  }

  .book-row{ display:flex; gap:12px; align-items:flex-start; min-width:0; }
  .book-row__cover{
    flex:none; width:64px; height:92px; border-radius:3px;
    border:2px solid var(--oak-900); background:var(--navy);
    background-size:cover; background-position:center;
  }
  .book-row__body{ flex:1; min-width:0; color:var(--ink); }
  .book-row__title{
    margin:0; font-family:"Georgia", serif; font-weight:800;
    font-size:17px; line-height:1.25; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .book-row__author{ margin:2px 0 0; font-size:14px; font-style:italic; color:#4a3420; opacity:.9; }
  .book-row__meta{
    margin-top:6px; display:flex; flex-wrap:nowrap; gap:4px; align-items:center;
    overflow:hidden; min-width:0;
  }
  .tag--light{
    font-size:10px; padding:2px 6px; border-radius:9px;
    background:rgba(42,28,16,.08); border:1px solid rgba(74,36,16,.35);
    color:var(--ink); white-space:nowrap; flex:none;
  }
  .book-row__meta .tag--light:first-child{ min-width:34px; flex-shrink:1; overflow:hidden; text-overflow:ellipsis; }
  .tag--light.tag--progress{ background:var(--xp-green); border-color:#4c8a34; color:#0e2409; font-weight:bold; }
  .book-row__divider{
    height:1px; margin:8px 0;
    background:linear-gradient(to right, transparent, #9b662c 15%, #9b662c 85%, transparent);
    opacity:.55;
  }
  .book-row__synopsis{
    margin:0; font-size:14px; line-height:1.35; color:#3a2812; font-style:italic;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .grimoire-card.is-focused .panel{ cursor:pointer; }

  .book-row__actions{ flex:none; display:none; flex-direction:column; gap:8px; }
  .grimoire-card.is-focused.is-revealed .book-row__actions{ display:flex; }
  .icon-action-btn{
    width:36px; height:36px; padding:0; border:none; background:none; cursor:pointer;
    transition:transform .12s ease;
  }
  .icon-action-btn img{ width:100%; height:100%; display:block; }
  .icon-action-btn:active{ transform:scale(.92); }

  .card-actions{ display:none; gap:8px; margin-top:8px; }
  .grimoire-card.is-focused.is-revealed .card-actions{ display:flex; }
  .empty-state{ text-align:center; padding:40px 16px; color:var(--parchment); font-style:italic; opacity:.7; }

  /* ============ FAB (relevé au-dessus du bandeau de nav) ============ */
  .fab-add{
    position:fixed; left:50%; bottom:74px; transform:translateX(-50%); z-index:35;
    display:flex; align-items:center; gap:8px;
  }
  .fab-add svg{ width:14px; height:14px; }

  /* ============ MODALE ============ */
  .modal-overlay{
    position:fixed; inset:0; z-index:60; background:rgba(10,7,4,.78);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.is-open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    background:linear-gradient(160deg,#2f2013,var(--oak-900));
    border-top:3px solid var(--brass); border-radius:10px 10px 0 0;
    padding:18px 18px 26px; box-shadow:0 -8px 30px rgba(0,0,0,.6);
  }
  .modal-sheet__handle{ width:40px; height:4px; background:rgba(232,205,148,.3); border-radius:2px; margin:0 auto 14px; }
  .modal-sheet h2{ font-size:13px; margin:0 0 16px; color:var(--brass-light); text-align:center; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:15px; color:var(--brass-light); }
  .field input, .field select, .field textarea{
    font-family:'VT323', monospace; font-size:18px; padding:8px 10px;
    border:2px solid var(--brass); border-radius:4px; background:#150e07; color:var(--parchment);
    resize:vertical;
  }
  .field-hint{ font-size:12px; color:var(--parchment); opacity:.55; text-align:right; }
  .difficulte-etoiles{ display:flex; gap:6px; }
  .difficulte-etoiles .etoile{ font-size:26px; line-height:1; cursor:pointer; opacity:.35; background:none; border:none; padding:0; color:var(--brass-light,#e8cd94); }
  .difficulte-etoiles .etoile.is-active{ opacity:1; }
  .form-actions{ display:flex; gap:10px; margin-top:16px; }
  .form-actions .btn-dnd{ flex:1; }

  .illustration-picker{
    display:flex; flex-direction:column; gap:8px;
    padding:10px; background:rgba(0,0,0,.18);
    border:1px solid rgba(201,168,118,.35); border-radius:5px;
  }
  .illustration-picker input[type=file]{ padding:7px; font-size:16px; }
  .illustration-preview{
    display:none; align-items:center; gap:10px;
    min-height:82px; padding:8px;
    border:1px solid rgba(201,168,118,.3); border-radius:4px;
    background:#150e07;
  }
  .illustration-preview.is-visible{ display:flex; }
  .illustration-preview img{
    width:54px; height:76px; object-fit:cover; image-rendering:pixelated;
    border:1px solid var(--brass); border-radius:2px; background:#1c1209;
  }
  .illustration-preview span{ font-size:15px; line-height:1.25; color:var(--parchment); opacity:.85; }
  .illustration-status{ min-height:18px; font-size:14px; color:var(--brass-light); }
</style>
</head>
<body>

  <nav class="topbar-rubrique">
    <img src="images/topbar-bg.png" alt="">
    <h1 class="page-title">Réserve</h1>
    <button class="topbar-hitbox" id="topbar-hitbox" type="button" aria-label="Afficher ou masquer le résumé de la Réserve"></button>
  </nav>

  <main class="reserve-scene">

    <p class="evolutive-plaque" id="evolutive-plaque">
      <svg class="evolutive-plaque__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
      </svg>
      <span class="evolutive-plaque__text" id="evolutive-phrase">Chargement de ta Réserve…</span>
    </p>

    <div class="control-bar">
      <div class="ribbon-tabs" role="tablist" aria-label="Sections de la Réserve">
        <button class="ribbon-tab-img" id="tab-bibliotheque" role="tab" aria-selected="true" aria-controls="panel-bibliotheque" type="button">
          <img src="images/button-bibliotheque.png" alt="Bibliothèque">
        </button>
        <button class="ribbon-tab-img" id="tab-archives" role="tab" aria-selected="false" aria-controls="panel-archives" type="button">
          <img src="images/button-archives.png" alt="Archives">
        </button>
      </div>

      <div class="filters-bar">
        <div class="sort-trigger">
          <img src="images/button-trier.png" alt="Trier par">
          <select id="sort-select" aria-label="Trier par">
            <option value="none">Trier par…</option>
            <option value="author">Auteur</option>
            <option value="genre">Genre littéraire</option>
          </select>
        </div>
      </div>
    </div>

    <section id="panel-bibliotheque" class="carousel-area" role="tabpanel" aria-labelledby="tab-bibliotheque">
      <ul class="grimoire-list" id="bibliotheque-list"></ul>
    </section>

    <section id="panel-archives" class="carousel-area" role="tabpanel" aria-labelledby="tab-archives" hidden>
      <ul class="grimoire-list" id="archives-list"></ul>
    </section>

  </main>

  <button class="fab-add btn-dnd" id="open-add-modal" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14" /></svg>
    Ajouter un Grimoire
  </button>

  <nav class="rubrique-nav" aria-label="Rubriques">
    <a href="index.html">Antre</a>
    <a href="reserve.html" aria-current="page">Réserve</a>
    <a href="encours.html">En cours</a>
    <a href="notes.html">Guilde</a>
    <a href="acquisition.html">Acquis.</a>
  </nav>

  <div class="modal-overlay" id="modal-manual">
    <div class="modal-sheet">
      <div class="modal-sheet__handle"></div>
      <h2 id="modal-title">Ajouter un Grimoire</h2>
      <form id="manual-form">
        <div class="field">
          <label for="f-title">Titre</label>
          <input id="f-title" name="title" type="text" required />
        </div>
        <div class="field">
          <label for="f-author">Auteur</label>
          <input id="f-author" name="author" type="text" required />
        </div>
        <div class="field">
          <label for="f-pages">Nombre de pages</label>
          <input id="f-pages" name="pageCount" type="number" min="1" required />
        </div>
        <div class="field">
          <label for="f-genre">Genre littéraire</label>
          <select id="f-genre" name="genre" required>
            <option value="fantasy">Fantasy</option>
            <option value="science-fiction">Science-fiction</option>
            <option value="medieval-fantastique">Médiéval fantastique</option>
            <option value="thriller">Thriller</option>
            <option value="policier">Policier</option>
            <option value="biographie">Biographie</option>
            <option value="philosophie">Philosophie</option>
            <option value="aventure">Aventure</option>
            <option value="classique">Classique</option>
            <option value="theatre">Théâtre</option>
            <option value="poesie">Poésie</option>
            <option value="essai">Essai</option>
            <option value="ouvrage-prime">Ouvrage primé</option>
          </select>
        </div>
        <div class="field">
          <label>Difficulté supposée</label>
          <div class="difficulte-etoiles" id="f-difficulte-etoiles" role="radiogroup" aria-label="Difficulté supposée">
            <button type="button" class="etoile" data-valeur="1">★</button>
            <button type="button" class="etoile" data-valeur="2">★</button>
            <button type="button" class="etoile" data-valeur="3">★</button>
          </div>
          <input type="hidden" id="f-difficulte" name="difficulte" value="1" />
          <span class="field-hint">Ajustable plus tard, en cours de lecture, dès 60 pages lues.</span>
        </div>
        <div class="field">
          <label for="f-synopsis">Résumé</label>
          <textarea id="f-synopsis" name="synopsis" maxlength="120" rows="2" placeholder="Une phrase qui résume l'histoire…"></textarea>
          <span class="field-hint"><span id="synopsis-count">0</span>/120</span>
        </div>
        <div class="field">
          <label for="f-provenance">Provenance</label>
          <select id="f-provenance" name="provenance">
            <option value="achete">Acheté</option>
            <option value="cadeau">Cadeau</option>
            <option value="emprunt">Emprunt</option>
          </select>
        </div>
        <div class="field">
          <label for="f-illustration">Illustration du Grimoire</label>
          <div class="illustration-picker">
            <input id="f-illustration" name="illustration" type="file" accept="image/*" />
            <div class="illustration-preview" id="illustration-preview">
              <img id="illustration-preview-img" alt="Aperçu de l’illustration" />
              <span id="illustration-preview-text">Illustration pixel art prête.</span>
            </div>
            <div class="illustration-status" id="illustration-status" aria-live="polite"></div>
          </div>
        </div>
        <div class="field">
          <label for="f-destination">Destination</label>
          <select id="f-destination" name="destination">
            <option value="backlog">Bibliothèque (à lire)</option>
            <option value="finished">Archives (déjà lu, hors XP)</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn-dnd btn-dnd--ghost" id="cancel-manual" type="button">Annuler</button>
          <button class="btn-dnd btn-dnd--danger" id="delete-manual" type="button" hidden>Supprimer</button>
          <button class="btn-dnd" id="modal-submit-btn" type="submit">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="reserve-app.js"></script>
</body>
</html>
