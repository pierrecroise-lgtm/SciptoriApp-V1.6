<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>La Guilde — ScriptoriApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel:wght@800&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* notes.html reste autonome : tout son CSS et son JS spécifiques sont
     ici (et dans notes-app.js). La topbar-image, le panneau 9-slice, le
     bandeau de nav et les boutons .btn-dnd viennent de common.css.
     Le parchemin de notes de séance (notes-overlay.js) est un module
     PARTAGÉ avec reserve.html (Archives) et encours.html : les trois
     rubriques renvoient exactement au même endroit. */

  body{ font-size:19px; }
  .hidden{ display:none !important; }

  /* ============ SCENE — pas d'illustration dédiée pour l'instant,
     un dégradé chêne cohérent avec le reste de l'app en attendant. ============ */
  .guilde-scene{
    position:relative; min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(201,168,118,.08), transparent 55%),
      linear-gradient(180deg, #241708, #170f08 55%);
  }
  .guilde-content{ max-width:560px; margin:0 auto; padding:16px 14px 110px; }

  .guilde-phrase{
    margin:0 0 16px; padding:12px 14px;
    background:linear-gradient(180deg, var(--oak-800), var(--oak-900));
    border:2px solid var(--brass); border-radius:4px;
    box-shadow:0 4px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(232,205,148,.12);
    font-size:15px; line-height:1.4; color:var(--parchment);
  }
  .guilde-phrase strong{ color:var(--brass-light); }

  /* ============ BARRE DE CONTROLE ============ */
  .control-bar{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .sort-trigger{ position:relative; width:132px; flex:none; cursor:pointer; }
  .sort-trigger img{ width:100%; display:block; }
  .sort-trigger select{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; border:none; cursor:pointer;
  }
  #toggle-search.is-active{ filter:drop-shadow(0 0 8px var(--brass-light)); }

  .search-row{ margin-bottom:14px; }
  .search-row input{
    width:100%; box-sizing:border-box;
    font-family:'VT323', monospace; font-size:20px; padding:8px 10px;
    border:2px solid var(--brass); border-radius:4px; background:#150e07; color:var(--parchment);
  }

  /* ============ LISTE DES OUVRAGES ACHEVES ============ */
  .grimoire-list{ display:flex; flex-direction:column; gap:16px; margin:0; padding:0; list-style:none; }

  .book-row{ display:flex; gap:12px; align-items:flex-start; min-width:0; cursor:pointer; }
  .book-row__cover{
    flex:none; width:64px; height:92px; border-radius:3px;
    border:2px solid var(--oak-900); background:var(--navy);
    background-size:cover; background-position:center;
  }
  .book-row__body{ flex:1; min-width:0; color:var(--ink); }
  .book-row__title{
    margin:0; font-family:"Georgia", serif; font-weight:800;
    font-size:17px; line-height:1.25; color:var(--ink);
  }
  .book-row__author{ margin:2px 0 0; font-size:14px; font-style:italic; color:#4a3420; opacity:.9; }
  .book-row__meta{
    margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; align-items:center;
  }
  .tag--light{
    font-size:10px; padding:2px 6px; border-radius:9px;
    background:rgba(42,28,16,.08); border:1px solid rgba(74,36,16,.35);
    color:var(--ink); white-space:nowrap;
  }
  .guilde-note{ font-size:13px; color:#a3791f; letter-spacing:1px; }
  .guilde-chevron{
    flex:none; align-self:center;
    font-family:'Press Start 2P', monospace; font-size:9px; color:#6b4423;
  }

  .book-row__divider{
    height:1px; margin:10px 0 8px;
    background:linear-gradient(to right, transparent, #9b662c 15%, #9b662c 85%, transparent);
    opacity:.55;
  }
  .book-row__synopsis{ margin:0 0 10px; font-size:14px; line-height:1.35; color:#3a2812; font-style:italic; }

  .guilde-detail{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .guilde-detail.is-open{ max-height:220px; margin-top:2px; }
  .guilde-detail__stats{
    display:grid; grid-template-columns:1fr 1fr; gap:6px 14px;
    margin-bottom:10px;
  }
  .guilde-stat{ display:flex; flex-direction:column; gap:1px; }
  .guilde-stat .label{ font-size:10px; letter-spacing:.02em; color:#6b4423; text-transform:uppercase; }
  .guilde-stat .value{ font-size:15px; color:var(--ink); font-weight:600; }

  .guilde-notes-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .guilde-notes-btn img{ width:20px; height:20px; object-fit:contain; }

  .empty-state{
    text-align:center; padding:40px 16px;
    background:linear-gradient(180deg, var(--oak-800), var(--oak-900));
    border:2px solid var(--brass); border-radius:6px;
    color:var(--parchment); font-style:italic; opacity:.8;
  }

  @media (max-width:380px){
    .guilde-detail__stats{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <nav class="topbar-rubrique">
    <img src="images/topbar-bg.png" alt="">
    <h1 class="page-title">Guilde</h1>
  </nav>

  <main class="guilde-scene">
    <div class="guilde-content">

      <p class="guilde-phrase" id="guilde-phrase">Chargement des archives de la Guilde…</p>

      <div class="control-bar">
        <div class="sort-trigger">
          <img src="images/button-trier.png" alt="Trier par">
          <select id="sort-select" aria-label="Trier par">
            <option value="recent">Terminé récemment</option>
            <option value="title">Titre</option>
            <option value="author">Auteur</option>
            <option value="genre">Genre littéraire</option>
          </select>
        </div>
        <button class="btn-dnd btn-dnd--small" id="toggle-search" type="button">Recherche</button>
      </div>

      <div class="search-row hidden" id="search-row">
        <input id="search-input" type="text" placeholder="Titre ou auteur…" autocomplete="off">
      </div>

      <ul class="grimoire-list" id="guilde-list"></ul>

    </div>
  </main>

  <nav class="rubrique-nav" aria-label="Rubriques">
    <a href="index.html">Antre</a>
    <a href="reserve.html">Réserve</a>
    <a href="encours.html">En cours</a>
    <a href="notes.html" aria-current="page">Guilde</a>
    <a href="acquisition.html">Acquis.</a>
  </nav>

  <script type="module" src="notes-app.js"></script>
</body>
</html>
