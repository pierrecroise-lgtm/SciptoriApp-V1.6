<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLibrary — Le Grimoire du Lecteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* index.html reste volontairement léger : la home garde sa propre
     topbar, son propre HUD, ses grimoires et le Grand Maître, tous
     inline ici. Les variables, le reset et la typographie de base
     viennent de common.css. */

  /* ============ TOP BAR (spécifique à la home) ============ */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 22px;
    background:linear-gradient(180deg,#2b1c12,#1c1209);
    border-bottom:3px solid #c9a876;
    box-shadow:0 4px 14px rgba(0,0,0,.55);
    position:relative; z-index:10;
  }
  .topbar .title{ font-size:14px; color:#e8cd94; text-shadow:2px 2px 0 #000; }
  .topbar .icon-btn{ background:none;border:none;cursor:pointer;color:#c9a876; display:flex;align-items:center;justify-content:center; }
  .topbar .icon-btn.img-btn{
  padding:6px; border-radius:50%;
  background:rgba(232,205,148,.85);
  border:1px solid rgba(201,168,118,.6);
  transition:transform .15s ease, filter .15s ease;
}
.topbar .icon-btn.img-btn:hover{ transform:scale(1.08); filter:drop-shadow(0 0 6px #e8cd94); }
.topbar .icon-btn.img-btn:active{ transform:scale(.92); }
.topbar .icon-btn.img-btn img{ width:26px; height:26px; display:block; object-fit:contain; }
  .topbar .left, .topbar .right{ display:flex; align-items:center; gap:14px; }

  /* ============ SCENE ============ */
  .scene{
    position:relative;
    min-height:calc(100vh - 60px);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background-size:cover;
    background-position:center bottom;
    background-repeat:no-repeat;
  }
  .scene::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,6,3,.15) 0%, rgba(10,6,3,.05) 30%, rgba(10,6,3,.55) 100%);
    pointer-events:none;
  }

  /* ============ HUD CARD ============ */
  .hud-wrap{
    position:relative; z-index:6;
    margin:34px 0 0 20px;
    width:min(420px, 86vw);
    height:clamp(76px, 15vmin, 96px);
  }
  .hud-card{
    position:relative;
    width:100%; height:100%;
    background:linear-gradient(160deg, #ecd9ab 0%, #d9bd83 100%);
    border:4px solid #4a2410;
    border-radius:14px;
    box-shadow:0 7px 0 rgba(0,0,0,.35), 0 12px 18px rgba(0,0,0,.5), inset 0 0 0 2px #f3e6c4;
    overflow:hidden;
    opacity:0; transform:translateY(-24px);
    transition:width .45s cubic-bezier(.5,0,.2,1), opacity .5s ease, transform .5s ease;
  }
  .hud-card.entered{ opacity:1; transform:translateY(0); }
  .hud-card.collapsed{ width:clamp(64px, 15vmin, 82px); }

  .avatar-frame{
    position:absolute; left:-4px; bottom:-6px;
    height:clamp(112px, 22vmin, 142px);
    z-index:3;
    cursor:pointer;
    background:none; border:none; padding:0;
    opacity:0; transform:translateY(-16px) scale(.85);
    transition:opacity .5s ease .12s, transform .5s ease .12s, filter .2s ease;
    filter:drop-shadow(2px 5px 3px rgba(0,0,0,.45));
  }
  .avatar-frame.entered{ opacity:1; transform:translateY(0) scale(1); }
  .avatar-frame:hover{ filter:drop-shadow(2px 5px 3px rgba(0,0,0,.45)) drop-shadow(0 0 10px #e8cd94); }
  .avatar-frame img{ height:100%; width:auto; display:block; pointer-events:none; }

  .hud-content{
    height:100%;
    padding:10px 14px 10px clamp(78px, 18vmin, 98px);
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    color:var(--ink);
    transition:opacity .25s ease;
  }
  .hud-card.collapsed .hud-content{ opacity:0; }
  .lvl-line{ font-size:clamp(12px,2.6vmin,17px); line-height:1.1; }
  .bar-track{ height:clamp(10px,1.76vmin,13px); background:var(--navy); border:2px solid var(--ink); overflow:hidden; position:relative; border-radius:2px; flex-shrink:0 }
  .bar-fill{ height:100%; transition:width .6s ease; }
  .bar-fill.xp{ background:repeating-linear-gradient(90deg, var(--xp-green) 0 6px, #59a844 6px 12px); }
  .bar-fill.book{ background:repeating-linear-gradient(90deg, var(--book-blue) 0 6px, #3d87b3 6px 12px); }
  .bar-inline-label{ font-size:clamp(10px,1.9vmin,13px); font-weight:600; position:absolute; right:4px; top:50%; transform:translateY(-50%); color:#fff; text-shadow:1px 1px 0 #000; }

  .current-book-row{ display:flex; gap:8px; align-items:center; }
  .current-book-text{ flex:1; min-width:0; }
  .current-book-text .label{ font-size:clamp(9px,1.9vmin,12px); opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }

  /* ============ TABLE + GRIMOIRES ============ */
  .table-area{
    margin-top:auto;
    margin-bottom:auto;
    position:relative; z-index:5;
    padding:40px 16px 34px;
    display:flex; justify-content:center;
  }
  .grimoire-grid{
    position:relative; z-index:2;
    display:flex;
    gap:20px;
    justify-content:center;
  }
  .grimoire-col{
    display:flex; flex-direction:column; gap:20px;
    transition:transform .7s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }

  .character-container{
    display:none; /* V2 : Grand Maître masqué pour l'instant, code conservé */
    position:absolute;
    left:50%; bottom:4%;
    width:clamp(120px, 30vw, 200px);
    aspect-ratio:300/420;
    transform:translateX(-50%);
    transform-origin:bottom center;
    pointer-events:auto;
    cursor:pointer;
    z-index:3;
  }
  .character-sprite{
    width:100%; height:100%;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center bottom;
    filter:drop-shadow(0 10px 10px rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(87,224,232,.2));
    animation:gmFloat 2.5s ease-in-out infinite alternate;
  }
  @keyframes gmFloat{
    0%{ transform:translateY(0); }
    100%{ transform:translateY(-8px); }
  }
  .edge-zone{
    position:fixed; top:0; bottom:0; width:60px;
    z-index:40; pointer-events:none;
    transition:background .3s ease;
  }
  .edge-zone.left{ left:0; background:linear-gradient(90deg, rgba(87,224,232,.12), transparent); }
  .edge-zone.right{ right:0; background:linear-gradient(-90deg, rgba(87,224,232,.12), transparent); }
  .edge-zone.active{ pointer-events:auto; cursor:pointer; }
  .grimoire{
    position:relative;
    width:clamp(115px, 29.9vmin, 172.5px);
    cursor:pointer;
    background:none; border:none; padding:0;
    transition:transform .25s ease, filter .25s ease;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));
  }
  .grimoire img{ width:100%; height:auto; display:block; image-rendering:auto; }
  .grimoire:hover, .grimoire:focus-visible{ transform:translateY(-10px); outline:none; }
  .grimoire.encours:hover{ filter:drop-shadow(0 16px 6px rgba(0,0,0,.4)) drop-shadow(0 0 16px #e0824a) drop-shadow(0 0 26px #e0824a); }
  .grimoire.reserve:hover{ filter:drop-shadow(0 16px 6px rgba(0,0,0,.4)) drop-shadow(0 0 16px #4f8fe0) drop-shadow(0 0 26px #4f8fe0); }
  .grimoire.acquisition:hover{ filter:drop-shadow(0 16px 6px rgba(0,0,0,.4)) drop-shadow(0 0 16px #6fbf4f) drop-shadow(0 0 26px #6fbf4f); }
  .grimoire.notes:hover{ filter:drop-shadow(0 16px 6px rgba(0,0,0,.4)) drop-shadow(0 0 16px #a35fe0) drop-shadow(0 0 26px #a35fe0); }
  .grimoire:active{ transform:translateY(-3px) scale(.97); }

  canvas.sparkle-layer{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  @media (max-width:420px){
    .grimoire-grid{ gap:8px; }
  }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9a876">
<link rel="apple-touch-icon" href="images/avatar-lvl1.png">
</head>
<body>

<nav class="topbar">
  <div class="left">
    <span class="title pixel">ScriptoriApp</span>
  </div>
  <div class="right">
    <button class="icon-btn img-btn" id="btnReglages" aria-label="Réglages">
      <img id="imgReglages" alt="Réglages">
    </button>
    <button class="icon-btn img-btn" id="btnIA" aria-label="Recommandations IA">
      <img id="imgIA" alt="IA">
    </button>
  </div>
</nav>

<div class="scene" id="scene">
  <div class="hud-wrap" id="hudWrap">
    <div class="hud-card" id="hudCard">
      <div class="hud-content">
        <div class="lvl-line">LVL <b id="levelNum">1</b> — <span id="playerTitle">Apprenti Lecteur</span></div>
        <div class="bar-track"><div class="bar-fill xp" id="xpBar" style="width:0%"></div><span class="bar-inline-label" id="xpLabel">0 / 300 XP</span></div>

        <div class="current-book-row">
          <div class="current-book-text">
            <span class="label" id="bookTitle">📖 Chargement du livre en cours…</span>
            <div class="bar-track"><div class="bar-fill book" id="bookBar" style="width:0%"></div><span class="bar-inline-label" id="bookPct">0 / 0</span></div>
          </div>
        </div>
      </div>
    </div>
    <button class="avatar-frame" id="avatarBtn" aria-label="Afficher ou masquer les statistiques" tabindex="0">
      <img id="avatarImg" alt="Avatar">
    </button>
  </div>

  <div class="table-area">
    <div class="grimoire-grid" id="grimoireGrid">
      <div class="grimoire-col left">
        <button class="grimoire encours" data-grimoire="encours" aria-label="En Cours"><img id="imgEncours" alt="En Cours"></button>
        <button class="grimoire acquisition" data-grimoire="acquisition" aria-label="Acquisition"><img id="imgAcquisition" alt="Acquisition"></button>
      </div>
      <div class="grimoire-col right">
        <button class="grimoire reserve" data-grimoire="reserve" aria-label="Réserve"><img id="imgReserve" alt="Réserve"></button>
        <button class="grimoire notes" data-grimoire="notes" aria-label="Guilde"><img id="imgNotes" alt="Guilde"></button>
      </div>
    </div>
  </div>

  <div class="character-container" id="grandMaitreContainer">
    <div class="character-sprite" id="grandMaitreSprite"></div>
  </div>
</div>

<div class="edge-zone left" id="edgeLeft"></div>
<div class="edge-zone right" id="edgeRight"></div>

<canvas class="sparkle-layer" id="sparkles"></canvas>

<script type="module" src="home-app.js"></script>

<script>
const ASSETS = {
  sceneBg1: "images/home-bg1.png",
  sceneBg2: "images/home-bg2.png",
  grimoireEncours: "images/grimoire-encours.png",
  grimoireReserve: "images/grimoire-reserve.png",
  grimoireAcquisition: "images/grimoire-acquisition.png",
  grimoireNotes: "images/grimoire-notes.png",
  avatarLvl1: "images/avatar-lvl1.png",
  avatarLvl2: "images/avatar-lvl2.png",
  buttonIA: "images/button-IA.png",
  buttonReglages: "images/button-reglages.png",
  gmN: "images/gm-n.png",
  gmNE: "images/gm-ne.png",
  gmE: "images/gm-e.png",
  gmSE: "images/gm-se.png",
  gmS: "images/gm-s.png",
  gmSW: "images/gm-sw.png",
  gmW: "images/gm-w.png",
  gmNW: "images/gm-nw.png"
};


// ---- Wire up images ----
document.getElementById('avatarImg').src = ASSETS.avatarLvl1;
document.getElementById('imgEncours').src = ASSETS.grimoireEncours;
document.getElementById('imgReserve').src = ASSETS.grimoireReserve;
document.getElementById('imgAcquisition').src = ASSETS.grimoireAcquisition;
document.getElementById('imgNotes').src = ASSETS.grimoireNotes;
document.getElementById('imgReglages').src = ASSETS.buttonReglages;
document.getElementById('imgIA').src = ASSETS.buttonIA;

document.getElementById('btnReglages').addEventListener('click', ()=>{
  console.log('Ouvrir les réglages');
});
document.getElementById('btnIA').addEventListener('click', ()=>{
  console.log('Ouvrir les recommandations IA');
});

// ---- Fond de scène : scene-bg2 suspendu pour l'instant (le temps de finaliser la marche) ----
document.getElementById('scene').style.backgroundImage = `url(${ASSETS.sceneBg1})`;

// ---- HUD entrance + auto-collapse + tap-to-toggle ----
const hudCard = document.getElementById('hudCard');
const avatarBtn = document.getElementById('avatarBtn');
let collapseTimer = null;

function scheduleAutoCollapse(delay = 3500){
  clearTimeout(collapseTimer);
  collapseTimer = setTimeout(()=> hudCard.classList.add('collapsed'), delay);
}

window.addEventListener('load', ()=>{
  requestAnimationFrame(()=>{
    hudCard.classList.add('entered');
    avatarBtn.classList.add('entered');
  });
  scheduleAutoCollapse(3500);
});

avatarBtn.addEventListener('click', ()=>{
  const willExpand = hudCard.classList.contains('collapsed');
  hudCard.classList.toggle('collapsed');
  if(willExpand){ scheduleAutoCollapse(4000); } // re-collapse a bit later after manual expand
  else { clearTimeout(collapseTimer); }
});

// ---- Sparkle particles on grimoire click ----
const sparkleCanvas = document.getElementById('sparkles');
const sctx = sparkleCanvas.getContext('2d');
function resizeCanvas(){ sparkleCanvas.width = innerWidth; sparkleCanvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let particles = [];
function spawnSparkles(x,y, color){
  for(let i=0;i<18;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 1 + Math.random()*3;
    particles.push({ x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed - 1, life:1, color });
  }
}
function tick(){
  sctx.clearRect(0,0,sparkleCanvas.width, sparkleCanvas.height);
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.02;
    if(p.life>0){ sctx.globalAlpha = p.life; sctx.fillStyle = p.color; sctx.fillRect(p.x, p.y, 3, 3); }
  });
  particles = particles.filter(p=>p.life>0);
  requestAnimationFrame(tick);
}
tick();

const glowColors = { encours:'#e0824a', reserve:'#4f8fe0', acquisition:'#6fbf4f', notes:'#a35fe0' };
const ROUTES = { encours:'encours.html', reserve:'reserve.html', notes:'notes.html', acquisition:'acquisition.html' };
document.querySelectorAll('.grimoire').forEach(el=>{
  const type = el.dataset.grimoire;
  el.addEventListener('click', ()=>{
    const rect = el.getBoundingClientRect();
    spawnSparkles(rect.left+rect.width/2, rect.top+rect.height/2, glowColors[type] || '#57e0e8');
    spawnSparkles(rect.left+rect.width/2, rect.top+rect.height/2, '#e8cd94');
    if (ROUTES[type]) {
      setTimeout(() => { window.location.href = ROUTES[type]; }, 220);
    } else {
      console.log(`Rubrique "${type}" pas encore construite (V2).`);
    }
  });
  el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ el.click(); } });
});

// ---- Grimoires: auto-scatter to the edges, tap edge zone to recenter ----
const leftCol = document.querySelector('.grimoire-col.left');
const rightCol = document.querySelector('.grimoire-col.right');
const edgeLeft = document.getElementById('edgeLeft');
const edgeRight = document.getElementById('edgeRight');
const PEEK = 44; // px still visible at the screen edge once scattered
let scatterTimer = null;
let isScattered = false;

function scatterColumns(){
  const lRect = leftCol.getBoundingClientRect();
  const rRect = rightCol.getBoundingClientRect();
  const lShift = (PEEK - lRect.width) - lRect.left;
  const rShift = (window.innerWidth - PEEK) - rRect.left;
  leftCol.style.transform = `translateX(${lShift}px)`;
  rightCol.style.transform = `translateX(${rShift}px)`;
  isScattered = true;
  edgeLeft.classList.add('active');
  edgeRight.classList.add('active');
}

function recenterColumns(){
  leftCol.style.transform = '';
  rightCol.style.transform = '';
  isScattered = false;
  edgeLeft.classList.remove('active');
  edgeRight.classList.remove('active');
  scheduleScatter();
}

function scheduleScatter(delay = 6000){
  clearTimeout(scatterTimer);
  scatterTimer = setTimeout(scatterColumns, delay);
}

edgeLeft.addEventListener('click', recenterColumns);
edgeRight.addEventListener('click', recenterColumns);
window.addEventListener('resize', ()=>{ if(isScattered) scatterColumns(); });

// V2 : le scatter automatique des grimoires est désactivé pour l'instant.
// Les fonctions scatterColumns()/recenterColumns()/scheduleScatter() restent
// disponibles ci-dessus, il suffit de redécommenter la ligne suivante :
// scheduleScatter(6000);

// ---- Grand Maître : position statique (le mouvement reviendra plus tard) ----
const gmContainer = document.getElementById('grandMaitreContainer');
const gmSprite = document.getElementById('grandMaitreSprite');

gmSprite.style.backgroundImage = `url(${ASSETS.gmS})`;

gmContainer.addEventListener('click', ()=>{
  console.log('Ouvrir le panneau des Quêtes du Grand Maître');
});
  if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>

</body>
</html>
